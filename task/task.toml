artifacts = ["/app/report.json"]

[task]
name = "dynamo/document-collection-reporting"
description = "Aggregate business metrics from multiple JSON document collections with inconsistent fields and identifier casing."

[metadata]
category = "Data Querying and Databases"
subcategory = "NoSQL and document stores"

model_tested = "Opus-4.8"
agent_tested = "Terminus-2"

task_objective = ["analyze", "transform", "generate"]
artifact_type = [
    "database_or_structured_store",
    "generated_output_artifact",
    "single_script_or_program"
]

expert_time_estimate_hours = 4.0

difficulty_explanation = "This synthetic commerce dataset models schema evolution and operational data inconsistencies: multiple versions of logical customers, products, and orders must be reconciled before aggregation; identifiers use inconsistent casing and field names; product categories may be missing; and order lines contain discounts and independent cancellation states. These details make naive aggregation produce incorrect business reporting."

solution_explanation = "Load all three collections, normalize logical identifiers, retain the highest schema_version for each logical entity, derive categories from the retained product catalog, then process only active order lines. Subtract each line discount from quantity times unit price, count orders containing cancelled lines, aggregate customer spend, product quantities, and category revenue, apply the specified lexical tie-breakers, and serialize the six required metrics."

verification_explanation = "Tests independently reconcile customers, products, and orders by logical identifier and highest schema_version, then recompute revenue, active customers, cancelled-order counts, top customer, top product, and category revenue from the retained records. Numeric revenue comparisons use a 1e-2 absolute tolerance to match the verifier rounding and comparison behavior."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
